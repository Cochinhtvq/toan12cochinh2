<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - GTLN & GTNN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), inset 0 0 15px rgba(0,0,0,0.1);
            border: 8px solid #ffffff;
            background-color: #fff;
        }

        @media (min-width: 768px) {
            .wheel-container {
                width: 400px;
                height: 400px;
            }
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e11d48;
            z-index: 10;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
        }

        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: #fff;
            border: 4px solid #f59e0b;
            border-radius: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #d97706;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .center-button:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.05);
            background-color: #fef3c7;
        }

        .center-button:active:not(:disabled) {
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        .center-button:disabled {
            background-color: #e5e7eb;
            color: #9ca3af;
            border-color: #d1d5db;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 600px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .option-btn {
            transition: all 0.2s;
        }
        
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .correct {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #059669 !important;
        }

        .incorrect {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #b91c1c !important;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        math {
            font-size: 1.1em;
        }
    </style>
    <!-- MathJax để hiển thị công thức Toán học đẹp mắt -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="text-gray-800">

    <header class="text-center py-6">
        <h1 class="text-3xl md:text-5xl font-extrabold text-white drop-shadow-md mb-2">Vòng Quay Toán Học</h1>
        <p class="text-lg md:text-xl text-white font-semibold opacity-90">GTLN & GTNN của Hàm Số</p>
    </header>

    <main class="flex-grow flex flex-col items-center px-4">
        
        <div class="bg-white/30 backdrop-blur-md rounded-2xl p-4 mb-6 flex space-x-8 shadow-lg border border-white/50">
            <div class="text-center">
                <p class="text-sm uppercase font-bold text-gray-600">Điểm</p>
                <p id="score" class="text-3xl font-black text-amber-600">0</p>
            </div>
            <div class="text-center">
                <p class="text-sm uppercase font-bold text-gray-600">Câu hỏi</p>
                <p class="text-3xl font-black text-blue-600"><span id="questions-answered">0</span>/10</p>
            </div>
        </div>

        <!-- Vòng Quay -->
        <div class="wheel-container">
            <div class="pointer"></div>
            <div id="wheel"></div>
            <button id="spin-btn" class="center-button select-none">QUAY</button>
        </div>

        <div class="mt-8 text-center max-w-lg">
            <p id="status-msg" class="text-white font-semibold text-lg bg-black/20 px-4 py-2 rounded-lg inline-block backdrop-blur-sm">Nhấn QUAY để chọn một câu hỏi ngẫu nhiên!</p>
        </div>

        <button id="reset-btn" class="mt-6 px-6 py-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-full shadow-md transition-colors hidden">Chơi Lại Từ Đầu</button>

    </main>

    <div id="question-modal" class="modal-overlay">
        <div class="modal-content relative">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 bg-blue-500 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl shadow-lg border-2 border-white" id="question-number-badge">?</div>
            
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Câu hỏi</h2>
            
            <div id="question-text" class="text-lg mb-6 leading-relaxed min-h-[80px]"></div>
            
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>
            
            <div id="explanation-container" class="hidden mt-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
                <h3 class="font-bold text-blue-800 mb-2">Lời giải thích:</h3>
                <div id="explanation-text" class="text-gray-700 text-sm"></div>
            </div>

            <div class="mt-6 flex justify-end">
                <button id="next-btn" class="hidden px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition-colors">Tiếp Tục</button>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu 10 câu hỏi về GTLN, GTNN (Sử dụng \\ để escape đúng cú pháp chuỗi JavaScript cho MathJax)
        const questionsData = [
            {
                id: 1,
                question: "Giá trị lớn nhất của hàm số \\(y = -x^2 + 4x - 3\\) trên \\(\\mathbb{R}\\) là:",
                options: ["\\(1\\)", "\\(3\\)", "\\(-3\\)", "Không có giá trị lớn nhất"],
                correctAnswer: 0,
                explanation: "Hàm số bậc hai có hệ số \\(a = -1 < 0\\) nên đạt giá trị lớn nhất tại đỉnh parabol \\(x = -\\frac{b}{2a} = -\\frac{4}{2(-1)} = 2\\). Giá trị lớn nhất là \\(y(2) = -2^2 + 4(2) - 3 = 1\\)."
            },
            {
                id: 2,
                question: "Tìm giá trị nhỏ nhất của hàm số \\(y = \\frac{2x - 1}{x + 1}\\) trên đoạn \\([0; 2]\\).",
                options: ["\\(-1\\)", "\\(1\\)", "\\(0\\)", "\\(2\\)"],
                correctAnswer: 0,
                explanation: "Đạo hàm \\(y' = \\frac{2(1) - (-1)(1)}{(x+1)^2} = \\frac{3}{(x+1)^2} > 0, \\forall x \\neq -1\\). Hàm số đồng biến trên đoạn \\([0; 2]\\). Do đó, GTNN đạt tại \\(x = 0\\) và bằng \\(y(0) = \\frac{-1}{1} = -1\\)."
            },
            {
                id: 3,
                question: "Cho hàm số \\(y = x^3 - 3x^2 + 2\\). Gọi \\(M, m\\) lần lượt là GTLN và GTNN của hàm số trên đoạn \\([0; 3]\\). Tính \\(M + m\\).",
                options: ["\\(0\\)", "\\(2\\)", "\\(4\\)", "\\(6\\)"],
                correctAnswer: 0,
                explanation: "\\(y' = 3x^2 - 6x = 0 \\Leftrightarrow x=0\\) hoặc \\(x=2\\). Tính các giá trị: \\(y(0) = 2\\), \\(y(2) = 2^3 - 3(2^2) + 2 = -2\\), \\(y(3) = 3^3 - 3(3^2) + 2 = 2\\). Vậy \\(M = 2\\), \\(m = -2\\). Tổng \\(M+m = 0\\)."
            },
            {
                id: 4,
                question: "Hàm số \\(y = \\sin x + \\cos x\\) có giá trị lớn nhất là:",
                options: ["\\(1\\)", "\\(2\\)", "\\(\\sqrt{2}\\)", "Không tồn tại"],
                correctAnswer: 2,
                explanation: "Ta có \\(y = \\sin x + \\cos x = \\sqrt{2}\\sin\\left(x + \\frac{\\pi}{4}\\right)\\). Vì \\(-1 \\le \\sin\\left(x + \\frac{\\pi}{4}\\right) \\le 1\\) nên \\(-\\sqrt{2} \\le y \\le \\sqrt{2}\\). Vậy GTLN là \\(\\sqrt{2}\\)."
            },
            {
                id: 5,
                question: "Giá trị nhỏ nhất của hàm số \\(y = x + \\frac{4}{x}\\) trên khoảng \\((0; +\\infty)\\) là:",
                options: ["\\(2\\)", "\\(4\\)", "\\(8\\)", "Không tồn tại"],
                correctAnswer: 1,
                explanation: "Vì \\(x > 0\\), áp dụng bất đẳng thức AM-GM: \\(y = x + \\frac{4}{x} \\ge 2\\sqrt{x \\cdot \\frac{4}{x}} = 4\\). Dấu \"=\" xảy ra khi \\(x = \\frac{4}{x} \\Leftrightarrow x=2 \\in (0; +\\infty)\\). Vậy GTNN là 4."
            },
            {
                id: 6,
                question: "Tìm tập giá trị của hàm số \\(y = \\sqrt{4 - x^2}\\).",
                options: ["\\([-2; 2]\\)", "\\([0; 2]\\)", "\\([0; 4]\\)", "\\([2; +\\infty)\\)"],
                correctAnswer: 1,
                explanation: "Tập xác định: \\(4 - x^2 \\ge 0 \\Leftrightarrow -2 \\le x \\le 2\\). Ta có \\(0 \\le 4-x^2 \\le 4 \\Rightarrow 0 \\le \\sqrt{4-x^2} \\le 2\\). Vậy tập giá trị là \\([0; 2]\\), tương ứng GTNN là 0, GTLN là 2."
            },
            {
                id: 7,
                question: "Hàm số \\(y = \vert{}x^2 - 4x + 3\vert{}\\) đạt GTNN tại mấy điểm trên \\(\\mathbb{R}\\)?",
                options: ["\\(1\\) điểm", "\\(2\\) điểm", "\\(3\\) điểm", "Không có điểm nào"],
                correctAnswer: 1,
                explanation: "Vì trị tuyệt đối luôn lớn hơn hoặc bằng 0, nên GTNN \\(y=0\\). Dấu \"=\" xảy ra khi \\(x^2 - 4x + 3 = 0 \\Leftrightarrow x=1\\) hoặc \\(x=3\\). Có 2 điểm làm hàm số đạt GTNN."
            },
            {
                id: 8,
                question: "Trên đoạn \\([-2; 1]\\), hàm số \\(y = x^4 - 2x^2 + 3\\) đạt GTLN tại \\(x\\) bằng:",
                options: ["\\(-2\\)", "\\(-1\\)", "\\(0\\)", "\\(1\\)"],
                correctAnswer: 0,
                explanation: "\\(y' = 4x^3 - 4x = 0 \\Leftrightarrow x=0, x=\\pm1\\). Các điểm thuộc đoạn: \\(-1, 0, 1\\). Tính: \\(y(-2)=16-8+3=11\\); \\(y(-1)=1-2+3=2\\); \\(y(0)=3\\); \\(y(1)=2\\). GTLN là 11 đạt tại \\(x=-2\\)."
            },
            {
                id: 9,
                question: "Giá trị lớn nhất của hàm số \\(y = \\frac{x}{x^2 + 1}\\) là:",
                options: ["\\(1\\)", "\\(\\frac{1}{2}\\)", "\\(2\\)", "\\(0\\)"],
                correctAnswer: 1,
                explanation: "\\(y' = \\frac{1(x^2+1) - x(2x)}{(x^2+1)^2} = \\frac{1-x^2}{(x^2+1)^2}\\). \\(y'=0 \\Leftrightarrow x=\\pm1\\). Lập BBT, ta thấy GTLN đạt tại \\(x=1\\), \\(y(1) = \\frac{1}{1^2+1} = \\frac{1}{2}\\)."
            },
            {
                id: 10,
                question: "Khẳng định nào sai? Cho hàm số \\(y = f(x)\\) liên tục trên đoạn \\([a; b]\\)",
                options: [
                    "Luôn có giá trị lớn nhất trên \\([a; b]\\)", 
                    "Luôn có giá trị nhỏ nhất trên \\([a; b]\\)", 
                    "Có thể đạt GTLN tại nhiều điểm thuộc \\([a; b]\\)", 
                    "Chỉ đạt GTLN tại duy nhất \\(1\\) điểm thuộc \\([a; b]\\)"
                ],
                correctAnswer: 3,
                explanation: "Định lý Weierstrass: Hàm số liên tục trên một đoạn thì luôn đạt GTLN và GTNN trên đoạn đó. Tuy nhiên, nó có thể đạt GTLN tại nhiều điểm (ví dụ hàm hằng \\(y=c\\) đạt GTLN tại mọi điểm). Vậy khẳng định D sai."
            }
        ];

        let state = {
            availableQuestions: [...questionsData],
            score: 0,
            questionsAnswered: 0,
            totalQuestions: questionsData.length,
            isSpinning: false,
            currentDegree: 0,
            currentQuestion: null
        };

        const colors = [
            '#F87171', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA',
            '#F472B6', '#FCD34D', '#4ADE80', '#93C5FD', '#C084FC'
        ];

        const wheelElement = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modal = document.getElementById('question-modal');
        const nextBtn = document.getElementById('next-btn');
        const statusMsg = document.getElementById('status-msg');

        function drawWheel() {
            const numSlices = state.availableQuestions.length;
            if (numSlices === 0) {
                wheelElement.style.background = '#e5e7eb';
                return;
            }

            const sliceAngle = 360 / numSlices;
            let gradientParts = [];
            
            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = (i + 1) * sliceAngle;
                const colorIndex = (state.availableQuestions[i].id - 1) % colors.length;
                gradientParts.push(`${colors[colorIndex]} ${startAngle}deg ${endAngle}deg`);
            }

            wheelElement.style.background = `conic-gradient(${gradientParts.join(', ')})`;
            
            wheelElement.innerHTML = '';
            for (let i = 0; i < numSlices; i++) {
                const angle = i * sliceAngle + (sliceAngle / 2);
                const label = document.createElement('div');
                label.className = 'absolute font-bold text-white text-xl drop-shadow-md';
                label.innerText = 'Q' + state.availableQuestions[i].id;
                
                label.style.left = '50%';
                label.style.top = '50%';
                label.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-110px)`;
                
                wheelElement.appendChild(label);
            }
        }

        spinBtn.addEventListener('click', spinWheel);

        function spinWheel() {
            if (state.isSpinning || state.availableQuestions.length === 0) return;
            
            state.isSpinning = true;
            spinBtn.disabled = true;
            statusMsg.innerText = "Đang quay...";
            
            const spins = Math.floor(Math.random() * 5) + 4;
            const randomAngle = Math.floor(Math.random() * 360);
            
            const totalDegree = state.currentDegree + (spins * 360) + randomAngle;
            state.currentDegree = totalDegree;

            wheelElement.style.transform = `rotate(${totalDegree}deg)`;

            setTimeout(() => {
                determineQuestion(totalDegree);
            }, 4000);
        }

        function determineQuestion(totalDegree) {
            const numSlices = state.availableQuestions.length;
            const sliceAngle = 360 / numSlices;
            
            let normalizedDegree = totalDegree % 360;
            let pointerAngle = (360 - normalizedDegree) % 360;
            
            let winningIndex = Math.floor(pointerAngle / sliceAngle);
            
            if (winningIndex >= numSlices) winningIndex = numSlices - 1;
            if (winningIndex < 0) winningIndex = 0;

            state.currentQuestion = state.availableQuestions[winningIndex];
            state.availableQuestions.splice(winningIndex, 1);
            
            showQuestionModal(state.currentQuestion);
        }

        function showQuestionModal(q) {
            document.getElementById('question-number-badge').innerText = q.id;
            document.getElementById('question-text').innerHTML = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 rounded-xl font-medium text-gray-700';
                btn.innerHTML = `<span class="inline-block w-6 font-bold text-blue-500">${String.fromCharCode(65 + index)}.</span> ${optText}`;
                
                btn.onclick = () => handleAnswer(index, btn, q.correctAnswer);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation-container').classList.add('hidden');
            document.getElementById('explanation-text').innerHTML = q.explanation;
            nextBtn.classList.add('hidden');

            modal.classList.add('active');
            
            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById('question-text'), optionsContainer]);
            }
            
            statusMsg.innerText = "Hãy chọn một đáp án!";
        }

        function handleAnswer(selectedIndex, btnElement, correctIndex) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            state.questionsAnswered++;
            document.getElementById('questions-answered').innerText = state.questionsAnswered;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                state.score += 10;
                document.getElementById('score').innerText = state.score;
                statusMsg.innerText = "Chính xác! +10 điểm";
                createConfetti();
            } else {
                btnElement.classList.add('incorrect');
                buttons[correctIndex].classList.add('correct');
                statusMsg.innerText = "Chưa chính xác!";
            }

            document.getElementById('explanation-container').classList.remove('hidden');
            
            if (window.MathJax) {
                 MathJax.typesetPromise([document.getElementById('explanation-text')]);
            }

            nextBtn.classList.remove('hidden');
        }

        nextBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            state.isSpinning = false;
            
            if (state.availableQuestions.length > 0) {
                drawWheel();
                spinBtn.disabled = false;
                statusMsg.innerText = `Còn ${state.availableQuestions.length} câu hỏi. Nhấn QUAY!`;
            } else {
                drawWheel();
                statusMsg.innerText = `Hoàn thành! Tổng điểm: ${state.score}/100`;
                resetBtn.classList.remove('hidden');
            }
        });

        resetBtn.addEventListener('click', () => {
            state.availableQuestions = [...questionsData];
            state.score = 0;
            state.questionsAnswered = 0;
            state.currentDegree = 0;
            
            document.getElementById('score').innerText = '0';
            document.getElementById('questions-answered').innerText = '0';
            
            wheelElement.style.transition = 'none';
            wheelElement.style.transform = `rotate(0deg)`;
            
            setTimeout(() => {
                wheelElement.style.transition = 'transform 4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            }, 50);

            drawWheel();
            resetBtn.classList.add('hidden');
            spinBtn.disabled = false;
            statusMsg.innerText = "Nhấn QUAY để bắt đầu lại!";
        });

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'][Math.floor(Math.random() * 6)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }

        drawWheel();
    </script>
</body>
</html>
